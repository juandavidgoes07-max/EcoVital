function measure(txt){const e=mk("text",{class:"cap",x:-9999,y:-9999},$("caps"));e.textContent=txt;const w=e.getComputedTextLength();e.remove();return w;}
function drawCaps(t){
  const g=$("caps");while(g.firstChild)g.removeChild(g.firstChild);
  const words=SPEC.words;let cur=-1;
  for(let i=0;i<words.length;i++){if(t>=words[i].s)cur=i;}
  if(cur<0)return;
  const ch=SPEC.chunks.find(c=>cur>=c[0]&&cur<=c[1]);if(!ch)return;
  if(t>words[ch[1]].e+0.35)return;
  const ws=words.slice(ch[0],ch[1]+1).map(w=>w.w);
  const space=measure("a a")-measure("aa");const maxw=880;let lines=[[]],lw=0;
  ws.forEach((w,j)=>{const wl=measure(w);if(lw+wl>maxw&&lines[lines.length-1].length){lines.push([]);lw=0;}lines[lines.length-1].push({w,idx:ch[0]+j,wl});lw+=wl+space+12;});
  const y0=SPEC.capY||330;
  lines.forEach((ln,li)=>{const tot=ln.reduce((a,b)=>a+b.wl,0)+(ln.length-1)*(space+12);let x=540-tot/2;const y=y0+li*84;
    ln.forEach(o=>{if(o.idx===cur){const pad=12;const bk=back((t-words[o.idx].s)/0.15);
        mk("rect",{x:x-pad,y:y-60,width:o.wl+pad*2,height:80,rx:14,fill:"#2b4fd8",stroke:"#9fb4ff","stroke-width":4,transform:`translate(${x+o.wl/2} ${y-20}) scale(${0.85+0.15*bk}) translate(${-(x+o.wl/2)} ${-(y-20)})`},g);}
      const e=mk("text",{class:"cap",x:x,y:y,opacity:o.idx<=cur?1:0.55},g);e.textContent=o.w;x+=o.wl+space+12;});});
}

window.setSpec=function(s){SPEC=s;if(s.jar){$("jarimg").setAttribute("href",s.jar);show("jarphoto",true);show("jarsvg",false);}};
window.renderAt=function(t){
  const sc=SPEC.scenes;let idx=0;for(let i=0;i<sc.length;i++){if(t>=sc[i].start)idx=i;}
  for(const k in SCENES)show(k,false);
  const s=sc[idx];show(s.id,true);
  const lt=t-s.start;const d=(idx+1<sc.length?sc[idx+1].start:SPEC.duration)-s.start;
  SCENES[s.id](lt,d);
  const sh=parseFloat($(s.id).getAttribute("data-shake")||0);
  const z=1+0.12*(1-eo(lt/0.3));$(s.id).setAttribute("transform",`translate(${540+sh} 960) scale(${z}) translate(-540 -960)`);
  $("flash").setAttribute("opacity",idx>0?0.35*(1-clamp(lt/0.18)):0);
  drawCaps(t);
};
