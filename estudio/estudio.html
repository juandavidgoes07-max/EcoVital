<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="icon" href="data:,">
<style>
@font-face{font-family:P;src:url(fuentes/Poppins-Bold.ttf);font-weight:700 900}
@font-face{font-family:P;src:url(fuentes/Poppins-Medium.ttf);font-weight:500 600}
@font-face{font-family:P;src:url(fuentes/Poppins-Regular.ttf);font-weight:400}
:root{--acento:#9be15d;--acento2:#f7c948}
html,body{margin:0;padding:0;background:#000;width:1080px;height:1920px;overflow:hidden;font-family:P,Arial,sans-serif}
#gl{position:absolute;left:0;top:0;width:1080px;height:1920px}
#ov{position:absolute;left:0;top:0;width:1080px;height:1920px;pointer-events:none}
.capa{position:absolute;inset:0}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 55%,rgba(0,0,0,.55) 100%)}
#sup{position:absolute;left:0;top:0;width:1080px;height:700px;background:linear-gradient(180deg,rgba(0,0,0,.7),rgba(0,0,0,.42) 55%,rgba(0,0,0,0))}
#grano{position:absolute;inset:0;opacity:.06;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>")}
/* subtítulos karaoke con caja (estilo reels virales) */
.caps{position:absolute;left:540px;top:300px;width:900px;text-align:center;transform:translate(-50%,0);font-weight:700;font-size:66px;line-height:1.28;color:rgba(255,255,255,.55);letter-spacing:-.5px;text-shadow:0 4px 18px rgba(0,0,0,.75),0 0 3px rgba(0,0,0,.9)}
.caps .w{display:inline-block;padding:0 6px;border-radius:14px;transition:none}
.caps .w.pas{color:#fff}
.caps .w.res{color:var(--acento)}
.caps .w.act{color:#0b0f0c;background:var(--acento);box-shadow:0 8px 28px rgba(0,0,0,.35),0 0 0 4px rgba(255,255,255,.12);transform:scale(1.08);text-shadow:none}
/* contador de pasos */
.pasos{position:absolute;left:540px;top:205px;transform:translate(-50%,0);display:flex;gap:18px;transition:none}
.pd{width:54px;height:54px;border-radius:50%;border:3px solid rgba(255,255,255,.35);color:rgba(255,255,255,.6);font-weight:700;font-size:26px;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.25)}
.pd.hecho{background:var(--acento);border-color:var(--acento);color:#0b0f0c;opacity:.8}
.pd.act{background:var(--acento);border-color:#fff;color:#0b0f0c;transform:scale(1.25);box-shadow:0 0 30px var(--acento)}
.marca{position:absolute;left:540px;top:140px;transform:translate(-50%,0);font-weight:700;font-size:26px;letter-spacing:1px;color:var(--acento);opacity:.85;text-shadow:0 2px 10px rgba(0,0,0,.6)}
.titulo{position:absolute;left:540px;top:1330px;width:960px;transform:translate(-50%,0);text-align:center;font-weight:800;font-size:100px;line-height:1.02;color:#fff;letter-spacing:-2px;text-shadow:0 10px 40px rgba(0,0,0,.6)}
.titulo b{color:var(--acento)}
.subtitulo{position:absolute;left:540px;top:1430px;width:900px;transform:translate(-50%,0);text-align:center;font-weight:600;font-size:46px;color:#fff;opacity:.9}
.subtitulo b{background:var(--acento);color:#0b0f0c;padding:2px 14px;border-radius:12px}
.palabraGig{position:absolute;left:540px;top:1470px;transform:translate(-50%,0);font-weight:800;font-size:120px;letter-spacing:2px;color:#fff;text-shadow:0 0 40px var(--acento),0 8px 30px rgba(0,0,0,.6)}
.pasoTit{position:absolute;left:540px;top:1450px;width:920px;transform:translate(-50%,0);text-align:center;font-weight:800;font-size:76px;line-height:1.08;color:#fff;text-shadow:0 8px 30px rgba(0,0,0,.6)}
.pasoTit b{color:var(--acento)}
.tag{position:absolute;padding:14px 30px;border-radius:40px;background:var(--acento);color:#0b0f0c;font-weight:700;font-size:40px;white-space:nowrap;box-shadow:0 10px 30px rgba(0,0,0,.35);z-index:2}
.tag.b{background:#ff5a5a;color:#fff}
.tag.mini{font-size:31px;padding:9px 20px}
.tagln{position:absolute;height:4px;background:#fff;transform-origin:0 50%;opacity:.9;z-index:1}
.chip{position:absolute;padding:16px 30px;border-radius:22px;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.25);backdrop-filter:blur(8px);color:#fff;font-weight:700;font-size:40px;white-space:nowrap;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.chip b{color:var(--acento)}
.sticker{position:absolute;padding:22px 44px;border-radius:26px;background:var(--acento2);color:#14110a;font-weight:900;font-size:64px;white-space:nowrap;border:6px solid #fff;box-shadow:0 18px 50px rgba(0,0,0,.45)}
.sticker.grande{font-size:74px}
.sticker.sello{background:transparent;border:10px solid;font-size:120px;letter-spacing:6px;padding:10px 46px;border-radius:18px;box-shadow:none;text-shadow:0 0 30px rgba(0,0,0,.4)}
.sticker.mito{color:#ff5a5a;border-color:#ff5a5a}
.sticker.alerta{background:#ff3b3b;color:#fff}
.sticker.realidad{color:var(--acento);border-color:var(--acento)}
.fraseSello{position:absolute;left:540px;top:1380px;width:900px;transform:translate(-50%,0);text-align:center;font-weight:700;font-size:52px;color:#fff}
.splitLbl{position:absolute;top:1330px;font-weight:800;font-size:64px;padding:10px 30px;border-radius:18px}
.splitLbl.izq{left:110px;background:#6b7280;color:#fff}
.splitLbl.der{right:110px;background:var(--acento);color:#0b0f0c}
.combar{position:absolute;left:540px;top:1330px;width:820px;height:130px;transform:translate(-50%,-50%);border-radius:70px;background:#fff;display:flex;align-items:center;gap:24px;padding:0 26px;box-sizing:border-box;box-shadow:0 20px 60px rgba(0,0,0,.45)}
.combar .av{width:84px;height:84px;border-radius:50%;background:linear-gradient(135deg,var(--acento),var(--acento2))}
.combar .txt{flex:1;font-weight:800;font-size:58px;color:#111;letter-spacing:1px}
.combar .cur{color:var(--acento);font-weight:400}
.combar .send{width:84px;height:84px;border-radius:50%;background:var(--acento);color:#0b0f0c;font-size:44px;display:flex;align-items:center;justify-content:center}
.comentaEncima{position:absolute;left:540px;top:1170px;transform:translate(-50%,0);font-weight:700;font-size:48px;color:#fff;white-space:nowrap}
.comentaEncima b{color:var(--acento)}
/* quiz (2026-11-17) */
.mapaTit{position:absolute;left:540px;top:1560px;max-width:960px;transform:translate(-50%,0);text-align:center;font-weight:800;font-size:76px;line-height:1.05;color:#fff;letter-spacing:-1px;text-shadow:0 10px 40px rgba(0,0,0,.7)}
.mapaTit b{background:var(--acento);color:#0b0f0c;padding:0 16px;border-radius:14px}
.quizPreg{position:absolute;left:540px;top:520px;max-width:900px;transform:translate(-50%,0);background:#fff;color:#14110a;font-weight:800;font-size:56px;line-height:1.1;padding:26px 40px 26px 110px;border-radius:34px;box-shadow:0 20px 60px rgba(0,0,0,.45);text-align:left;box-sizing:border-box;white-space:nowrap}
.quizPreg b{color:#fff;background:var(--acento);padding:0 12px;border-radius:12px;color:#0b0f0c}
.quizPreg .qi{position:absolute;left:24px;top:50%;transform:translateY(-50%);width:68px;height:68px;border-radius:50%;background:var(--acento);color:#0b0f0c;display:flex;align-items:center;justify-content:center;font-size:48px}
.quizOp{position:absolute;left:540px;width:780px;height:108px;transform:translate(-50%,0);border-radius:56px;background:rgba(255,255,255,.12);border:3px solid rgba(255,255,255,.35);backdrop-filter:blur(8px);display:flex;align-items:center;gap:24px;padding:0 22px;box-sizing:border-box;color:#fff;font-weight:700;font-size:46px;box-shadow:0 12px 34px rgba(0,0,0,.3)}
.quizOp .ql{width:70px;height:70px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:38px;flex:none}
.quizOp .qt{flex:1;white-space:nowrap}
.quizOp .qm{width:60px;font-size:52px;text-align:center}
.quizOp.ok{background:var(--acento);border-color:#fff;color:#0b0f0c;box-shadow:0 0 50px var(--acento)}
.quizOp.ok .ql{background:#0b0f0c;color:var(--acento)}
.quizOp.no{border-color:rgba(255,90,90,.6)}
.quizOp.no .qm{color:#ff5a5a}
</style>
<body>
<canvas id="gl" width="1080" height="1920"></canvas>
<div id="ov"><div id="vig"></div><div id="sup"></div><div id="grano"></div></div>
